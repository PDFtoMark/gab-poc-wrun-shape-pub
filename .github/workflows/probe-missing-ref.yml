name: Probe Missing Ref

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nonexistent branch
        uses: actions/checkout@v3
        with:
          ref: feature/attacker-only-branch
      - run: echo "CHECKED_OUT=$(git rev-parse HEAD)"
